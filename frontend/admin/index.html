
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Lady Laurant</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="login-contenedor">

        <section class="login-tarjeta">

            <div class="login-logo">
                <h1>Lady Laurant</h1>
                <p>Detalles hechos con amor</p>
            </div>

            <div class="login-decoracion"></div>

            <h2>Bienvenida</h2>
            <p class="login-descripcion">
                Ingresa tu contraseña para acceder al panel administrativo.
            </p>

            <form id="login-formulario">

                <div class="login-campo">
                    <label for="login-password">Contraseña de administrador</label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Escribe tu contraseña"
                        required
                    >
                </div>

                <button type="submit" id="login-boton">
                    Iniciar sesión
                </button>

                <p id="login-mensaje" class="login-mensaje"></p>

            </form>

            <a href="/" class="login-volver">Volver a la tienda</a>

        </section>

    </main>

    <script src="login.js"></script>

</body>
</html>
